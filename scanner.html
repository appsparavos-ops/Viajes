<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Redirigiendo…</title>
<!-- La app se mudó a una carpeta propia para poder instalarse por separado.
     Esta página existe solo para que los enlaces ya compartidos (WhatsApp, accesos
     directos, pestañas abiertas) sigan funcionando: redirige conservando los
     parámetros (?user=, ?id=, ?vista=…). NO es parte de ninguna app instalable,
     así que no declara manifest ni service worker. -->
<meta name="robots" content="noindex">
<!-- Declara el manifiesto de su app: si alguien tenía la app vieja instalada
     (con la dirección anterior), al abrirla una vez Chrome puede actualizarle
     sola la dirección y el alcance (scope). -->
<link rel="manifest" href="panel/manifest.json">
<link rel="canonical" href="panel/scanner.html">
<script>
  (function () {
    var destino = 'panel/scanner.html' + location.search + location.hash;
    try { location.replace(destino); } catch (e) { location.href = destino; }
  })();
</script>
<style>
  body { font-family: system-ui, sans-serif; background: #0f172a; color: #e2e8f0;
         display: grid; place-items: center; min-height: 100vh; margin: 0; text-align: center }
  a { color: #7dd3fc }
</style>
</head>
<body>
  <div>
    <p>Esta app ahora vive en otra dirección, te llevamos…</p>
    <p><a href="panel/scanner.html">Continuar a el Escáner</a></p>
  </div>
</body>
</html>
